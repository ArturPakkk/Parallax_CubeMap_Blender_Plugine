name: Verify and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Cancel superseded validation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=main&event=push&status=in_progress&per_page=20" --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER) | .id")
          for ID in $IDS; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$ID/cancel" || true
          done

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: '4.5.15'
            series: '4.5'
            sha256: '0d2b8bb2efe97e6c8eb57de6b7322f8800e1984e3125b60decca5f6771e4773e'
          - blender: '5.0.1'
            series: '5.0'
            sha256: '8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09'
    env:
      PYTHONUTF8: '1'
      BLENDER_USER_RESOURCES: ${{ github.workspace }}/GARBAGE/ci-profile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Download verified official Blender
        run: |
          ARCHIVE="blender-${{ matrix.blender }}-linux-x64.tar.xz"
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender${{ matrix.series }}/$ARCHIVE" --output "$RUNNER_TEMP/$ARCHIVE"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-${{ matrix.blender }}-linux-x64/blender" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -p test_package.py -v
      - run: '"$BLENDER" -b --factory-startup --offline-mode --python-exit-code 1 --python tests/regressions.py'
      - run: '"$BLENDER" -b --factory-startup --offline-mode --python-exit-code 1 --python tests/restore.py'
      - run: '"$BLENDER" -b --factory-startup --offline-mode --python-exit-code 1 --python tests/conflicts.py'
      - run: '"$BLENDER" -b --factory-startup GARBAGE/Verification/Scenes/Restore_Persistence_Test.blend --offline-mode --python-exit-code 1 --python tests/restore_reload.py'
      - run: python tools/package.py
      - run: '"$BLENDER" -b --factory-startup --command extension validate dist/*.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Parallax-CubeMap-${{ matrix.blender }}
          path: |
            dist/*.zip
            dist/*.sha256
            GARBAGE/Verification/Reports/*.json

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python tools/package.py
      - name: Publish installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('parallax_cubemap/blender_manifest.toml', 'rb'))['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published assets are preserved."
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" --title "Parallax_CubeMap $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
